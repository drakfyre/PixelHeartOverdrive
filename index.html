<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>Music Player</title>
        <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.0.1/css/all.min.css" integrity="sha512-2SwdPD6INVrV/lHTZbO2nodKhrnDdJK9/kg2XD1r9uGqPo1cUbujc+IYdlYdEErWNu69gVcYgdxlmVmzTWnetw==" crossorigin="anonymous" referrerpolicy="no-referrer" />
        <link rel="stylesheet" href="music-player.css">
    </head>
    <body>
        <audio id="audio-player" preload="auto">
            <source src="FullAlbum.ogg" type="audio/ogg">
            <source src="FullAlbum.m4a" type="audio/mp4">
        </audio>
        <div id="music-player">
            <img id="song-image" src="./albumart.jpeg"/>
            <div id="song-name">Song</div>
            <div id="song-artist">Artist</div>

            <input id="slider-song" type="range">

            <div id="music-buttons">            
                <i id="prev-song" class="fa-solid fa-backward-step fa-2x"></i>
                <i id="playpause-song" class="fa-solid fa-circle-play fa-3x"></i>
                <i id="next-song" class="fa-solid fa-forward-step fa-2x"></i>             
            </div>

            <div id="song-time">0.000</div>
        </div>
        <script src="music-player.js"></script>
    </body>
</html>
